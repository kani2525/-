<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>じぶん手帳｜プロフィール記録アプリ</title>
<style>
  :root{
    --bg: #f6f5fb;
    --bg-elevated: #ffffff;
    --text: #2b2a33;
    --text-muted: #7a7886;
    --border: #e5e2f0;
    --accent: #7c6fe0;
    --accent-2: #a695f2;
    --accent-text: #ffffff;
    --chip-bg: #eeecf9;
    --chip-bg-active: #7c6fe0;
    --chip-text-active: #ffffff;
    --shadow: 0 2px 10px rgba(60,50,110,0.07);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 999px;
    --danger: #d0466a;
    --ok: #2f9e6e;
  }
  html[data-theme="dark"]{
    --bg: #1a1824;
    --bg-elevated: #242232;
    --text: #f1efe7;
    --text-muted: #a6a2b8;
    --border: #38354a;
    --accent: #9d8ff7;
    --accent-2: #b9adf9;
    --accent-text: #1c1a2a;
    --chip-bg: #2d2a3f;
    --chip-bg-active: #9d8ff7;
    --chip-text-active: #1c1a2a;
    --shadow: 0 2px 14px rgba(0,0,0,0.4);
    --danger: #f28ba3;
    --ok: #79d6ac;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Segoe UI", Roboto, Meiryo, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 72px;
  }
  a{ color: inherit; }
  button{ font-family: inherit; }
  textarea{ font-family: inherit; }
  .hidden{ display:none !important; }

  /* ---------- header ---------- */
  header.topbar{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    padding: 18px 16px 22px;
    border-radius: 0 0 24px 24px;
    box-shadow: var(--shadow);
  }
  .topbar-inner{ max-width: 720px; margin:0 auto; }
  .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; gap: 8px; }
  header.topbar h1{ margin:0; font-size: 1.3rem; font-weight: 800; letter-spacing: .02em; }
  header.topbar .subtitle{ margin: 4px 0 0; font-size: .8rem; opacity:.9; }
  .header-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    border:none; background: rgba(255,255,255,.28); color:#fff;
    width:38px; height:38px; border-radius:50%; font-size:1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform: scale(.94); }

  .progress-wrap{ margin-top: 12px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:.72rem; opacity:.9; margin-bottom:4px; }
  .progress-track{ height:7px; background: rgba(255,255,255,.28); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:#fff; border-radius:999px; transition: width .3s ease; }

  /* ---------- nav tabs ---------- */
  .controls{
    max-width: 720px; margin: -14px auto 0; padding: 0 16px;
    position: relative; z-index: 5;
  }
  .view-tabs{
    display:flex; background: var(--bg-elevated); border-radius: var(--radius-sm);
    padding: 4px; box-shadow: var(--shadow); gap: 4px; overflow-x:auto;
  }
  .view-tabs button{
    flex:1; border:none; background:transparent; color: var(--text-muted);
    padding: 9px 8px; border-radius: var(--radius-sm); font-size:.78rem; font-weight:700; cursor:pointer;
    white-space: nowrap;
  }
  .view-tabs button.active{ background: var(--accent); color: var(--accent-text); }

  main{ max-width: 720px; margin: 0 auto; padding: 14px 16px 24px; }

  .card{
    background: var(--bg-elevated); border:1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 14px; padding: 16px; box-shadow: var(--shadow);
  }
  .card h2{ margin: 0 0 4px; font-size: 1rem; font-weight:800; display:flex; align-items:center; gap:6px; }
  .card .card-desc{ margin: 0 0 12px; font-size:.78rem; color: var(--text-muted); }

  .field{ margin-bottom: 12px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{ display:block; font-size:.75rem; font-weight:700; color: var(--text-muted); margin-bottom:5px; }
  .field input[type="text"], .field input[type="date"], .field select, .field textarea{
    width:100%; padding: 10px 12px; border-radius: var(--radius-md);
    border:1px solid var(--border); background: var(--bg); color: var(--text); font-size:.9rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: 2px solid var(--accent); }
  .field textarea{ resize: vertical; min-height: 64px; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px){ .two-col{ grid-template-columns: 1fr; } }

  /* ---------- chip tag editor ---------- */
  .chip-list{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 6px 6px 6px 12px; border-radius: var(--radius-sm); font-size: .82rem;
  }
  .chip button{
    border:none; background: rgba(0,0,0,.08); color: inherit; width:18px; height:18px; border-radius:50%;
    cursor:pointer; font-size:.7rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  html[data-theme="dark"] .chip button{ background: rgba(255,255,255,.12); }
  .chip-empty{ font-size:.8rem; color: var(--text-muted); padding: 2px 0 8px; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{ flex:1; }
  .add-row select{ flex: 0 0 auto; max-width: 40%; }
  .add-btn{
    border:none; background: var(--accent); color: var(--accent-text); padding: 0 16px; border-radius: var(--radius-md);
    font-size:.85rem; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .add-btn:active{ transform: scale(.96); }

  .fav-item{ display:flex; align-items:center; gap:8px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .fav-item:last-of-type{ border-bottom:none; }
  .fav-item .fav-cat{ font-size:.72rem; font-weight:700; color: var(--accent); background: var(--chip-bg); padding:3px 9px; border-radius: var(--radius-sm); flex-shrink:0; }
  .fav-item .fav-val{ flex:1; font-size:.88rem; }
  .fav-item .del-btn{ border:none; background:transparent; color: var(--text-muted); cursor:pointer; font-size:.9rem; padding:4px; }

  .custom-section{ border:1px dashed var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; }
  .custom-section .cs-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .custom-section .cs-head input{ flex:1; font-weight:700; }
  .cs-del{ border:none; background:transparent; color: var(--danger); cursor:pointer; font-size:1rem; padding:4px; }
  .add-section-btn{
    width:100%; border:1px dashed var(--border); background:transparent; color: var(--accent);
    padding: 12px; border-radius: var(--radius-md); font-weight:700; font-size:.85rem; cursor:pointer;
  }

  /* ---------- self-discovery Q&A ---------- */
  .today-q{
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .today-q .tq-label{ font-size:.7rem; opacity:.85; font-weight:700; letter-spacing:.04em; }
  .today-q .tq-text{ font-size:1rem; font-weight:800; margin: 6px 0 10px; }
  .today-q textarea{
    width:100%; border-radius: var(--radius-md); border:none; padding:10px 12px; font-size:.88rem;
    min-height:56px; background: rgba(255,255,255,.92); color:#2b2a33;
  }
  .today-q .tq-actions{ display:flex; justify-content:flex-end; margin-top:8px; }
  .today-q .tq-actions button{
    border:none; background: rgba(255,255,255,.9); color: var(--accent); font-weight:700;
    padding: 7px 16px; border-radius: var(--radius-sm); font-size:.82rem; cursor:pointer;
  }

  .cat-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .cat-chip{
    border:1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    padding: 6px 12px; border-radius: var(--radius-sm); font-size:.78rem; cursor:pointer;
  }
  .cat-chip.active{ background: var(--chip-bg-active); color: var(--chip-text-active); border-color:transparent; font-weight:700; }

  .qa-item{ background: var(--bg-elevated); border:1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .qa-item .qa-cat{ font-size:.68rem; color: var(--accent); font-weight:700; }
  .qa-item .qa-text{ font-size:.9rem; font-weight:700; margin: 4px 0 8px; }
  .qa-item textarea{ width:100%; border-radius: var(--radius-md); border:1px solid var(--border); background: var(--bg); color: var(--text); padding:9px 11px; font-size:.85rem; min-height:52px; }
  .qa-item .qa-save{ border:none; background: var(--accent); color: var(--accent-text); padding:7px 14px; border-radius: var(--radius-sm); font-size:.78rem; font-weight:700; cursor:pointer; margin-top:6px; }
  .qa-answer{ background: var(--chip-bg); border-radius: var(--radius-md); padding: 10px 12px; font-size:.86rem; }
  .qa-answer .qa-date{ font-size:.68rem; color: var(--text-muted); margin-top:4px; }
  .qa-item-actions{ display:flex; gap:8px; margin-top:8px; }
  .qa-item-actions button{ border:none; background:transparent; color: var(--accent); font-size:.76rem; font-weight:700; cursor:pointer; padding:4px 0; }
  .qa-history{ margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .qa-history .hist-entry{ font-size:.78rem; color: var(--text-muted); margin-bottom:6px; }
  .qa-history .hist-entry .hd{ font-size:.68rem; }

  /* ---------- intro generator ---------- */
  .toggle-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .toggle-row button{
    border:1px solid var(--border); background: var(--bg); color: var(--text);
    padding: 7px 13px; border-radius: var(--radius-sm); font-size:.8rem; cursor:pointer;
  }
  .toggle-row button.active{ background: var(--chip-bg-active); color: var(--chip-text-active); border-color:transparent; font-weight:700; }
  .check-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 12px; }
  .check-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background: var(--bg); padding:6px 12px; border-radius: var(--radius-sm); font-size:.8rem; cursor:pointer; }
  .check-pill input{ margin:0; }
  .gen-btn{ width:100%; border:none; background: var(--accent); color: var(--accent-text); padding: 12px; border-radius: var(--radius-md); font-size:.92rem; font-weight:800; cursor:pointer; }
  .gen-output{
    margin-top: 12px; background: var(--chip-bg); border-radius: var(--radius-md); padding: 14px; font-size:.92rem;
    white-space: pre-wrap; min-height: 60px;
  }
  .gen-output.empty{ color: var(--text-muted); font-size:.85rem; }
  .gen-actions{ display:flex; gap:8px; margin-top:10px; }
  .gen-actions button{
    flex:1; border:1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    padding: 9px; border-radius: var(--radius-sm); font-size:.82rem; font-weight:700; cursor:pointer;
  }

  /* ---------- settings ---------- */
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom: 4px; }
  .stat-box{ background: var(--chip-bg); border-radius: var(--radius-md); padding: 12px 8px; text-align:center; }
  .stat-box .num{ font-size:1.3rem; font-weight:800; color: var(--accent); }
  .stat-box .lbl{ font-size:.68rem; color: var(--text-muted); margin-top:2px; }
  .settings-btn{
    width:100%; text-align:left; border:1px solid var(--border); background: var(--bg); color: var(--text);
    padding: 12px 14px; border-radius: var(--radius-md); font-size:.85rem; cursor:pointer; margin-bottom:8px;
    display:flex; align-items:center; gap:10px;
  }
  .settings-btn.danger{ color: var(--danger); border-color: var(--danger); }
  #importFile{ display:none; }

  footer.app-footer{
    max-width: 720px; margin: 20px auto 0; padding: 0 16px; font-size: .72rem; color: var(--text-muted);
    text-align:center;
  }

  .toast{
    position: fixed; left:50%; bottom: 18px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: var(--radius-sm);
    font-size:.8rem; opacity:0; pointer-events:none; transition: opacity .2s ease; z-index: 50;
    max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; }

  .empty-state{ text-align:center; padding: 24px 10px; color: var(--text-muted); font-size:.85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div>
        <h1>📔 じぶん手帳</h1>
        <p class="subtitle">自己紹介にもう困らない、わたしのプロフィール帳</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="ダークモード切替">🌙</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>プロフィール充実度</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="view-tabs">
    <button data-view="profile" class="active">📇 プロフィール</button>
    <button data-view="discover">🔍 じぶんを知る</button>
    <button data-view="intro">💬 自己紹介文</button>
    <button data-view="settings">⚙️ データ</button>
  </div>
</div>

<main id="app"></main>

<footer class="app-footer">
  データはこの端末のブラウザ内（localStorage）だけに保存されます。サーバーには送信されません。<br>
  機種変更の前は「データ」タブからバックアップ（エクスポート）してください。
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     1. データ定義
  ========================================================= */

  var STORAGE_KEY = "jibun-techo-data-v1";
  var THEME_KEY = "jibun-techo-theme";

  var FAV_CATEGORIES = ["食べ物","飲み物","音楽・アーティスト","映画・アニメ","本・漫画","スポーツ","場所・旅先","言葉・座右の銘","その他"];

  var QUESTION_BANK = [
    { id:"q1",  cat:"価値観", text:"仕事や勉強で、いちばん大事にしていることは何ですか？" },
    { id:"q2",  cat:"価値観", text:"「これだけは譲れない」と思う考え方はありますか？" },
    { id:"q3",  cat:"価値観", text:"尊敬する人・憧れる人は誰ですか？その理由は？" },
    { id:"q4",  cat:"価値観", text:"お金を使うとき、何に一番お金をかけたいですか？" },
    { id:"q5",  cat:"過去", text:"子どもの頃、夢中になっていたものは何でしたか？" },
    { id:"q6",  cat:"過去", text:"人生でいちばん頑張ったと思う出来事は？" },
    { id:"q7",  cat:"過去", text:"これまでで一番うれしかったことは何ですか？" },
    { id:"q8",  cat:"過去", text:"失敗から学んだ、印象に残っていることはありますか？" },
    { id:"q9",  cat:"好み", text:"一日ずっと家にいるとしたら、何をして過ごしますか？" },
    { id:"q10", cat:"好み", text:"最近ハマっていること・気になっていることは？" },
    { id:"q11", cat:"好み", text:"好きな季節・好きな時間帯はいつですか？その理由は？" },
    { id:"q12", cat:"好み", text:"疲れたとき、何をすると元気になりますか？" },
    { id:"q13", cat:"好み", text:"誰かに一つだけおすすめするなら、何を紹介したいですか？" },
    { id:"q14", cat:"人間関係", text:"友人からよく言われる自分の性格は？" },
    { id:"q15", cat:"人間関係", text:"人と話すとき、意識していることはありますか？" },
    { id:"q16", cat:"人間関係", text:"どんな人と一緒にいると居心地がいいですか？" },
    { id:"q17", cat:"人間関係", text:"初対面の人に、まず何を知ってもらいたいですか？" },
    { id:"q18", cat:"未来", text:"1年後、どんな自分になっていたいですか？" },
    { id:"q19", cat:"未来", text:"いつか挑戦してみたいことは何ですか？" },
    { id:"q20", cat:"未来", text:"今、頑張っている・伸ばしたいと思っているスキルは？" },
    { id:"q21", cat:"未来", text:"将来、どんな形で人の役に立ちたいですか？" },
    { id:"q22", cat:"自分らしさ", text:"自分の長所を一言で言うと？" },
    { id:"q23", cat:"自分らしさ", text:"自分の短所だと思うところ、直したいところは？" },
    { id:"q24", cat:"自分らしさ", text:"周りの人と自分は、どこが違うと思いますか？" },
    { id:"q25", cat:"自分らしさ", text:"「自分らしいな」と感じる瞬間はどんなときですか？" },
    { id:"q26", cat:"自分らしさ", text:"もし自分にキャッチコピーをつけるなら？" }
  ];

  var DEFAULT_DATA = {
    basic: { name:"", furigana:"", nickname:"", birthday:"", bloodType:"", hometown:"", occupation:"", motto:"" },
    lists: { skills:[], hobbies:[], strengths:[], weaknesses:[], dislikes:[] },
    favorites: [],
    goals: "",
    customSections: [],
    qa: {},
    meta: { createdAt: null, updatedAt: null }
  };

  var LIST_META = {
    skills:     { label:"特技",     desc:"できること・得意なことを登録しましょう", ph:"例：ピアノ、料理、Excel" },
    hobbies:    { label:"趣味",     desc:"好きでよくやっていることを登録しましょう", ph:"例：読書、映画鑑賞、キャンプ" },
    strengths:  { label:"長所",     desc:"自分の強みだと思うところ", ph:"例：計画的、聞き上手" },
    weaknesses: { label:"短所",     desc:"直したい・課題だと感じているところ", ph:"例：心配性、飽きっぽい" },
    dislikes:   { label:"苦手なもの", desc:"苦手なこと・避けたいこと", ph:"例：早起き、虫" }
  };

  /* =========================================================
     2. 状態管理・永続化
  ========================================================= */

  var data = loadData();
  var state = { view:"profile", discoverCat:"すべて", todayQId: pickTodayQuestionId() };

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return deepClone(DEFAULT_DATA);
      var parsed = JSON.parse(raw);
      return Object.assign(deepClone(DEFAULT_DATA), parsed, {
        basic: Object.assign({}, DEFAULT_DATA.basic, parsed.basic),
        lists: Object.assign({}, DEFAULT_DATA.lists, parsed.lists),
        meta: Object.assign({}, DEFAULT_DATA.meta, parsed.meta)
      });
    }catch(e){ return deepClone(DEFAULT_DATA); }
  }

  function saveData(){
    data.meta.updatedAt = new Date().toISOString();
    if(!data.meta.createdAt) data.meta.createdAt = data.meta.updatedAt;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

  function pickTodayQuestionId(){
    var d = new Date();
    var seed = Number(d.getFullYear()+""+(d.getMonth()+1)+""+d.getDate());
    return QUESTION_BANK[seed % QUESTION_BANK.length].id;
  }

  function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
  }

  /* =========================================================
     3. テーマ
  ========================================================= */

  function applyTheme(t){
    if(t === "dark"){ document.documentElement.setAttribute("data-theme","dark"); }
    else{ document.documentElement.removeAttribute("data-theme"); }
    document.getElementById("themeToggle").textContent = t === "dark" ? "☀️" : "🌙";
  }
  function initTheme(){
    var saved = localStorage.getItem(THEME_KEY);
    var t = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(t);
  }
  document.getElementById("themeToggle").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  /* =========================================================
     4. トースト
  ========================================================= */

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  /* =========================================================
     5. プロフィール充実度
  ========================================================= */

  function computeCompleteness(){
    var total = 0, filled = 0;
    var basicFields = ["name","nickname","birthday","bloodType","hometown","occupation","motto"];
    basicFields.forEach(function(k){ total++; if(data.basic[k]) filled++; });
    Object.keys(data.lists).forEach(function(k){ total++; if(data.lists[k].length) filled++; });
    total++; if(data.favorites.length) filled++;
    total++; if(data.goals) filled++;
    total++; if(Object.keys(data.qa).length) filled++;
    return Math.round((filled/total)*100);
  }

  function buildIntro(){
    var b = data.basic;
    var name = b.nickname || b.name || "（名前未登録）";
    var tone = introState.tone;
    var p = PHRASES[tone];
    var parts = [];
    parts.push(pick(p.opening).replace("{name}", name));

    if(b.occupation && introState.length !== "compact"){
      parts.push(b.occupation + "です。");
    }
    if(b.hometown && introState.length === "detailed"){
      parts.push("出身は" + b.hometown + "です。");
    }

    var hobbySrc = data.lists.hobbies;
    var skillSrc = data.lists.skills;
    if(introState.length === "compact"){
      if(hobbySrc.length){ parts.push("趣味は" + joinList(hobbySrc,2) + "です。"); }
      else if(skillSrc.length){ parts.push("特技は" + joinList(skillSrc,2) + "です。"); }
    }else{
      if(hobbySrc.length){ parts.push("趣味は" + joinList(hobbySrc,3) + "です。"); }
      if(skillSrc.length){ parts.push("特技は" + joinList(skillSrc,3) + "です。"); }
    }

    if(introState.length !== "compact" && data.favorites.length){
      var fav = pick(data.favorites);
      parts.push("最近は" + fav.value + "（" + fav.category + "）にはまっています。");
    }

    if(introState.length === "detailed"){
      if(data.lists.strengths.length){ parts.push("長所は" + joinList(data.lists.strengths,2) + "なところです。"); }
      if(b.motto){ parts.push("大切にしている言葉は「" + b.motto + "」です。"); }
      if(data.goals){ parts.push("今後は" + data.goals.replace(/\n/g," ") + "と思っています。"); }
    }

    parts.push(pick(p.closing));
    return parts.join("");
  }

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function joinList(arr,max){
    var picked = arr.length <= max ? arr.slice() : shuffle(arr.slice()).slice(0,max);
    return picked.join("、");
  }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  function bindViewEvents(){
    var app = document.getElementById("app");

    // --- 基本情報 ---
    app.querySelectorAll("[data-basic]").forEach(function(el){
      el.addEventListener("change", function(){
        data.basic[el.dataset.basic] = el.value;
        saveData();
        renderProgress();
      });
    });

    // --- タグリスト（特技・趣味・長所・短所・苦手） ---
    Object.keys(LIST_META).forEach(function(key){
      var addBtn = app.querySelector('[data-tag-add="'+key+'"]');
      var input = app.querySelector('[data-tag-input="'+key+'"]');
      if(addBtn){
        addBtn.addEventListener("click", function(){ addTag(key, input); });
      }
      if(input){
        input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addTag(key, input); } });
      }
    });
    app.querySelectorAll("[data-remove-tag]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.dataset.removeTag, idx = Number(btn.dataset.idx);
        data.lists[key].splice(idx,1);
        saveData(); render();
      });
    });

    // --- 好きなもの ---
    var favAddBtn = app.querySelector("#favAddBtn");
    if(favAddBtn){
      favAddBtn.addEventListener("click", function(){
        var cat = app.querySelector("#favCatSelect").value;
        var input = app.querySelector("#favValInput");
        var val = input.value.trim();
        if(!val) return;
        data.favorites.push({ category: cat, value: val });
        saveData(); render();
        toast("追加しました");
      });
    }
    app.querySelectorAll("[data-del-fav]").forEach(function(btn){
      btn.addEventListener("click", function(){
        data.favorites.splice(Number(btn.dataset.delFav),1);
        saveData(); render();
      });
    });

    // --- 目標 ---
    var goalsInput = app.querySelector("#goalsInput");
    if(goalsInput){
      goalsInput.addEventListener("change", function(){ data.goals = goalsInput.value; saveData(); renderProgress(); });
    }

    // --- カスタムセクション ---
    var addSectionBtn = app.querySelector("#addSectionBtn");
    if(addSectionBtn){
      addSectionBtn.addEventListener("click", function(){
        data.customSections.push({ id: uid(), title:"", items:[] });
        saveData(); render();
      });
    }
    app.querySelectorAll("[data-cs-title]").forEach(function(el){
      el.addEventListener("change", function(){
        var sec = data.customSections.find(function(s){ return s.id === el.dataset.csTitle; });
        if(sec){ sec.title = el.value; saveData(); }
      });
    });
    app.querySelectorAll("[data-cs-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        data.customSections = data.customSections.filter(function(s){ return s.id !== btn.dataset.csDel; });
        saveData(); render();
      });
    });
    app.querySelectorAll("[data-cs-add]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.csAdd;
        var input = app.querySelector('[data-cs-input="'+id+'"]');
        addCustomItem(id, input);
      });
    });
    app.querySelectorAll("[data-cs-input]").forEach(function(input){
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); addCustomItem(input.dataset.csInput, input); }
      });
    });
    app.querySelectorAll("[data-cs-remove]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sec = data.customSections.find(function(s){ return s.id === btn.dataset.csRemove; });
        if(sec){ sec.items.splice(Number(btn.dataset.idx),1); saveData(); render(); }
      });
    });

    // --- じぶんを知る ---
    var todaySave = app.querySelector("#todayQSave");
    if(todaySave){
      todaySave.addEventListener("click", function(){
        var val = app.querySelector("#todayQInput").value.trim();
        if(!val) return;
        saveAnswer(state.todayQId, val);
        toast("記録しました");
        render();
      });
    }
    app.querySelectorAll("[data-cat]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.discoverCat = btn.dataset.cat; render(); });
    });
    app.querySelectorAll("[data-qa-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){ state["editing_"+btn.dataset.qaEdit] = true; render(); });
    });
    app.querySelectorAll("[data-qa-hist]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.qaHist;
        state["hist_"+id] = !state["hist_"+id];
        render();
      });
    });
    app.querySelectorAll("[data-qa-save]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.qaSave;
        var val = app.querySelector('[data-qa-input="'+id+'"]').value.trim();
        if(!val) return;
        saveAnswer(id, val);
        state["editing_"+id] = false;
        toast("保存しました");
        render();
      });
    });

    // --- 自己紹介文 ---
    app.querySelectorAll("[data-len]").forEach(function(btn){
      btn.addEventListener("click", function(){ introState.length = btn.dataset.len; render(); });
    });
    app.querySelectorAll("[data-tone]").forEach(function(btn){
      btn.addEventListener("click", function(){ introState.tone = btn.dataset.tone; render(); });
    });
    var genBtn = app.querySelector("#genBtn");
    if(genBtn){
      genBtn.addEventListener("click", function(){ introState.lastText = buildIntro(); render(); });
    }
    var regenBtn = app.querySelector("#regenBtn");
    if(regenBtn){
      regenBtn.addEventListener("click", function(){ introState.lastText = buildIntro(); render(); });
    }
    var copyBtn = app.querySelector("#copyBtn");
    if(copyBtn){
      copyBtn.addEventListener("click", function(){
        copyText(introState.lastText);
      });
    }

    // --- 設定・データ ---
    var exportBtn = app.querySelector("#exportBtn");
    if(exportBtn){ exportBtn.addEventListener("click", exportData); }
    var importBtn = app.querySelector("#importBtn");
    var importFile = app.querySelector("#importFile");
    if(importBtn && importFile){
      importBtn.addEventListener("click", function(){ importFile.click(); });
      importFile.addEventListener("change", function(){
        var file = importFile.files[0];
        if(file) importData(file);
      });
    }
    var resetBtn = app.querySelector("#resetBtn");
    if(resetBtn){ resetBtn.addEventListener("click", resetData); }
  }

  function addTag(key, input){
    var val = input.value.trim();
    if(!val) return;
    if(data.lists[key].indexOf(val) !== -1){ toast("すでに登録されています"); return; }
    data.lists[key].push(val);
    saveData(); render();
  }

  function addCustomItem(id, input){
    var val = input.value.trim();
    if(!val) return;
    var sec = data.customSections.find(function(s){ return s.id === id; });
    if(sec){ sec.items.push(val); saveData(); render(); }
  }

  function saveAnswer(qid, text){
    if(!data.qa[qid]) data.qa[qid] = [];
    data.qa[qid].push({ text: text, date: new Date().toISOString() });
    saveData();
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("コピーしました"); }, function(){ fallbackCopy(text); });
    }else{ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("コピーしました"); }catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear()+""+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    a.href = url; a.download = "jibun-techo-"+stamp+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("エクスポートしました");
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!confirm("現在のデータを上書きしてインポートしますか？")) return;
        data = Object.assign(deepClone(DEFAULT_DATA), parsed, {
          basic: Object.assign({}, DEFAULT_DATA.basic, parsed.basic),
          lists: Object.assign({}, DEFAULT_DATA.lists, parsed.lists),
          meta: Object.assign({}, DEFAULT_DATA.meta, parsed.meta)
        });
        saveData();
        render();
        toast("インポートしました");
      }catch(e){
        alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
      }
    };
    reader.readAsText(file);
  }

  function resetData(){
    if(!confirm("すべてのプロフィールデータを削除します。この操作は取り消せません。よろしいですか？")) return;
    if(!confirm("本当に削除してよろしいですか？")) return;
    data = deepClone(DEFAULT_DATA);
    saveData();
    render();
    toast("データを削除しました");
  }

  /* =========================================================
     12. 初期化
  ========================================================= */

  initTheme();
  render();

})();
</script>
</body>
</html>
