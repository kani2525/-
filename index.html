<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>じぶん手帳</title>
<style>
  :root{
    --bg: #f6f5fb;
    --bg-elevated: #ffffff;
    --text: #2b2a33;
    --text-muted: #7a7886;
    --border: #e5e2f0;
    --accent: #7c6fe0;
    --accent-2: #a695f2;
    --accent-text: #ffffff;
    --chip-bg: #eeecf9;
    --chip-bg-active: #7c6fe0;
    --chip-text-active: #ffffff;
    --shadow: 0 2px 10px rgba(60,50,110,0.07);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 999px;
    --danger: #d0466a;
    --ok: #2f9e6e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1a1824;
      --bg-elevated: #242232;
      --text: #f1efe7;
      --text-muted: #a6a2b8;
      --border: #38354a;
      --accent: #9d8ff7;
      --accent-2: #b9adf9;
      --accent-text: #1c1a2a;
      --chip-bg: #2d2a3f;
      --chip-bg-active: #9d8ff7;
      --chip-text-active: #1c1a2a;
      --shadow: 0 2px 14px rgba(0,0,0,0.4);
      --danger: #f28ba3;
      --ok: #79d6ac;
    }
  }
  html[data-theme="dark"]{
    --bg: #1a1824;
    --bg-elevated: #242232;
    --text: #f1efe7;
    --text-muted: #a6a2b8;
    --border: #38354a;
    --accent: #9d8ff7;
    --accent-2: #b9adf9;
    --accent-text: #1c1a2a;
    --chip-bg: #2d2a3f;
    --chip-bg-active: #9d8ff7;
    --chip-text-active: #1c1a2a;
    --shadow: 0 2px 14px rgba(0,0,0,0.4);
    --danger: #f28ba3;
    --ok: #79d6ac;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  html{ height:100%; }
  body{
    height:100%;
    min-height:100vh; min-height:100dvh;
    background: #100e17;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Segoe UI", Roboto, Meiryo, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    display:flex; align-items:center; justify-content:center;
    padding: 28px 14px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{ background:#0a0910; } }
  html[data-theme="dark"] body{ background:#0a0910; }
  a{ color: inherit; }
  button{ font-family: inherit; }
  textarea{ font-family: inherit; }
  .hidden{ display:none !important; }

  /* ---------- phone frame (mobile app mockup) ---------- */
  .phone-frame{
    position:relative; width:100%; max-width:412px; height:min(890px, 100%);
    aspect-ratio: 9 / 19.5;
    background: linear-gradient(160deg,#2c2a38,#131019);
    border-radius:48px; padding:14px;
    box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.05) inset;
  }
  .phone-notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:96px; height:24px; background:#000; border-radius:16px; z-index:30;
  }
  .phone-screen{
    position:relative; width:100%; height:100%; background: var(--bg);
    border-radius:34px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  @media (max-width:480px), (max-height:700px){
    body{ padding:0; background:var(--bg); display:block; }
    html[data-theme="dark"] body{ background:var(--bg); }
    .phone-frame{
      max-width:none; width:100vw; height:100vh; height:100dvh; aspect-ratio:auto;
      border-radius:0; padding:0; box-shadow:none; background:none;
    }
    .phone-notch{ display:none; }
    .phone-screen{ border-radius:0; }
  }

  /* ---------- header (app top bar) ---------- */
  header.topbar{
    flex-shrink:0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    padding: max(16px, env(safe-area-inset-top)) 18px 16px;
  }
  .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; gap: 8px; }
  header.topbar h1{ margin:0; font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; cursor:pointer; }
  header.topbar .subtitle{ margin: 3px 0 0; font-size: .74rem; opacity:.9; }
  .header-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    border:none; background: rgba(255,255,255,.28); color:#fff;
    width:34px; height:34px; border-radius:50%; font-size:.95rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform: scale(.94); }

  .progress-wrap{ margin-top: 12px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:.7rem; opacity:.9; margin-bottom:4px; }
  .progress-track{ height:6px; background: rgba(255,255,255,.28); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:#fff; border-radius:999px; transition: width .3s ease; }

  /* ---------- bottom tab bar (mobile app nav) ---------- */
  nav.bottom-nav{
    flex-shrink:0; background: var(--bg-elevated); border-top:1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bn-buttons{ display:flex; padding: 6px 2px 2px; }
  .bn-buttons button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    border:none; background:transparent; color: var(--text-muted);
    padding: 6px 2px; font-size:.62rem; font-weight:700; cursor:pointer;
  }
  .bn-buttons button .nav-icon{ font-size:1.28rem; line-height:1; }
  .bn-buttons button.active{ color: var(--accent); }
  .home-indicator-bar{ width:120px; height:5px; border-radius:3px; background: var(--text-muted); opacity:.35; margin: 6px auto 8px; }

  main{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding: 14px 16px 24px; }

  .card{
    background: var(--bg-elevated); border:1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 14px; padding: 16px; box-shadow: var(--shadow);
  }
  .card h2{ margin: 0 0 4px; font-size: 1rem; font-weight:800; display:flex; align-items:center; gap:6px; }
  .card .card-desc{ margin: 0 0 12px; font-size:.78rem; color: var(--text-muted); }

  .field{ margin-bottom: 0; }
  .field input[type="text"], .field input[type="date"], .field select, .field textarea{
    width:100%; padding: 12px 14px; border-radius: var(--radius-md);
    border:1px solid var(--border); background: var(--bg); color: var(--text); font-size:1rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: 2px solid var(--accent); }
  .field textarea{ resize: vertical; min-height: 90px; }

  /* ---------- chip tag editor ---------- */
  .chip-list{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 6px 6px 6px 12px; border-radius: var(--radius-sm); font-size: .85rem;
  }
  .chip button{
    border:none; background: rgba(0,0,0,.08); color: inherit; width:18px; height:18px; border-radius:50%;
    cursor:pointer; font-size:.7rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  html[data-theme="dark"] .chip button{ background: rgba(255,255,255,.12); }
  .chip-empty{ font-size:.82rem; color: var(--text-muted); padding: 2px 0 10px; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{ flex:1; }
  .add-row select{ flex: 0 0 auto; max-width: 42%; }
  .add-btn{
    border:none; background: var(--accent); color: var(--accent-text); padding: 0 16px; border-radius: var(--radius-md);
    font-size:.85rem; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .add-btn:active{ transform: scale(.96); }

  .fav-item{ display:flex; align-items:center; gap:8px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .fav-item:last-of-type{ border-bottom:none; }
  .fav-item .fav-cat{ font-size:.72rem; font-weight:700; color: var(--accent); background: var(--chip-bg); padding:3px 9px; border-radius: var(--radius-sm); flex-shrink:0; }
  .fav-item .fav-val{ flex:1; font-size:.88rem; }
  .fav-item .del-btn{ border:none; background:transparent; color: var(--text-muted); cursor:pointer; font-size:.9rem; padding:4px; }

  .custom-section{ border:1px dashed var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; }
  .custom-section .cs-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .custom-section .cs-head input{ flex:1; font-weight:700; padding:9px 11px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .cs-del{ border:none; background:transparent; color: var(--danger); cursor:pointer; font-size:1rem; padding:4px; }
  .add-section-btn{
    width:100%; border:1px dashed var(--border); background:transparent; color: var(--accent);
    padding: 12px; border-radius: var(--radius-md); font-weight:700; font-size:.85rem; cursor:pointer; margin-top:4px;
  }

  /* ---------- wizard (one-at-a-time entry) ---------- */
  .wizard-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .wz-home-btn{ border:none; background:transparent; color: var(--accent); font-weight:700; font-size:.85rem; cursor:pointer; padding:6px 0; }
  .wz-progress{ font-size:.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .wizard-card{ text-align:left; }
  .wz-icon{ font-size:2rem; margin-bottom:2px; }
  .wz-body{ margin-top:14px; }
  .swipe-hint-wrap{ margin-top:14px; width:100%; }
  .swipe-link{
    width:100%; border:1px dashed var(--border); background:transparent; color: var(--accent);
    padding: 10px; border-radius: var(--radius-md); font-size:.8rem; font-weight:700; cursor:pointer;
  }
  .swipe-hint-msg{
    background: var(--chip-bg); color: var(--text); font-size:.78rem; padding:10px 12px; border-radius: var(--radius-md);
    margin: 0 0 8px; text-align:center; line-height:1.5; animation: hint-fade-in .35s ease;
  }
  @keyframes hint-fade-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  .swipe-link.pulse{ animation: swipe-pulse 1.1s ease-in-out 2; border-style:solid; border-color: var(--accent); color: var(--accent); }
  @keyframes swipe-pulse{ 0%,100%{ transform:scale(1); box-shadow:none; } 50%{ transform:scale(1.03); box-shadow:0 0 0 5px rgba(124,111,224,.18); } }
  @media (prefers-reduced-motion: reduce){ .swipe-hint-msg{ animation:none; } .swipe-link.pulse{ animation:none; } }
  .wizard-nav{ display:flex; gap:10px; }
  .wz-btn{ flex:1; border:none; padding:14px; border-radius: var(--radius-md); font-size:.92rem; font-weight:800; cursor:pointer; }
  .wz-btn.primary{ background: var(--accent); color: var(--accent-text); }
  .wz-btn.ghost{ background: var(--bg-elevated); color: var(--text); border:1px solid var(--border); }
  .wz-btn[disabled]{ opacity:.4; cursor:not-allowed; }

  .date-picker-row{ display:flex; gap:8px; }
  .date-picker-row select{
    flex:1; min-width:0; padding: 13px 4px; border-radius: var(--radius-md);
    border:1px solid var(--border); background: var(--bg); color: var(--text); font-size:1rem; text-align:center;
  }
  .date-picker-row select:focus{ outline: 2px solid var(--accent); }

  .blood-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
  .blood-btn{
    border:1px solid var(--border); background: var(--bg); color: var(--text);
    padding: 18px 10px; border-radius: var(--radius-md); font-size:1.05rem; font-weight:800; cursor:pointer;
  }
  .blood-btn.active{ background: var(--accent); color: var(--accent-text); border-color:transparent; }
  .blood-btn.full{ width:100%; margin-top:10px; font-size:.85rem; font-weight:700; padding:12px; }

  /* ---------- home ---------- */
  .home-hero h2{ margin-bottom:6px; }
  .shortcut-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
  @media (min-width:480px){ .shortcut-grid{ grid-template-columns: repeat(3,1fr); } }
  .shortcut-item{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
    border:1px solid var(--border); background: var(--bg); border-radius: var(--radius-md);
    padding: 12px; cursor:pointer; color: var(--text); min-width:0;
  }
  .shortcut-item .si-icon{ font-size:1.25rem; }
  .shortcut-item .si-label{ font-size:.8rem; font-weight:700; margin-top:2px; }
  .shortcut-item .si-preview{
    font-size:.72rem; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .quick-links{ display:flex; gap:10px; flex-wrap:wrap; }
  .quick-link{
    flex:1; min-width:100px; display:flex; flex-direction:column; align-items:center; gap:6px;
    border:1px solid var(--border); background: var(--bg); border-radius: var(--radius-md);
    padding: 14px 8px; cursor:pointer; font-size:.78rem; font-weight:700; color: var(--text);
  }
  .quick-link .ql-icon{ font-size:1.5rem; }

  /* ---------- sub-view toggle ---------- */
  .toggle-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .toggle-row button{
    border:1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    padding: 8px 14px; border-radius: var(--radius-sm); font-size:.82rem; cursor:pointer; box-shadow: var(--shadow);
  }
  .toggle-row button.active{ background: var(--chip-bg-active); color: var(--chip-text-active); border-color:transparent; font-weight:700; }

  /* ---------- swipe deck ---------- */
  .cat-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .cat-chip{
    border:1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    padding: 6px 12px; border-radius: var(--radius-sm); font-size:.78rem; cursor:pointer;
  }
  .cat-chip.active{ background: var(--chip-bg-active); color: var(--chip-text-active); border-color:transparent; font-weight:700; }

  .swipe-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; padding: 4px 0 14px; }
  .swipe-stage{ position:relative; width:100%; max-width:340px; height:300px; }
  .swipe-card{
    position:absolute; inset:0; border-radius:22px; padding:22px; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    box-shadow: var(--shadow); cursor:grab; user-select:none; touch-action:none;
  }
  .swipe-card:active{ cursor:grabbing; }
  .swipe-card .sc-cat{ font-size:.68rem; font-weight:800; letter-spacing:.04em; opacity:.85; margin-bottom:10px; }
  .swipe-card .sc-text{ font-size:1.2rem; font-weight:800; line-height:1.45; }
  .swipe-card.top{ z-index:3; }
  .swipe-card.behind-1{ transform: scale(.95) translateY(10px); opacity:.75; z-index:2; }
  .swipe-card.behind-2{ transform: scale(.9) translateY(18px); opacity:.45; z-index:1; }
  .swipe-actions{ display:flex; gap:22px; }
  .swipe-btn{
    width:58px; height:58px; border-radius:50%; border:none; font-size:1.5rem; cursor:pointer;
    box-shadow: var(--shadow); background: var(--bg-elevated);
  }
  .swipe-btn.reject{ color: var(--danger); }
  .swipe-btn.accept{ color: var(--ok); }
  .swipe-empty{ text-align:center; color: var(--text-muted); padding: 30px 10px; font-size:.85rem; }
  .swipe-count{ font-size:.78rem; color: var(--text-muted); }

  /* ---------- self-discovery Q&A (journal) ---------- */
  .today-q{
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .today-q .tq-label{ font-size:.7rem; opacity:.85; font-weight:700; letter-spacing:.04em; }
  .today-q .tq-text{ font-size:1rem; font-weight:800; margin: 6px 0 10px; }
  .today-q textarea{
    width:100%; border-radius: var(--radius-md); border:none; padding:10px 12px; font-size:.88rem;
    min-height:56px; background: rgba(255,255,255,.92); color:#2b2a33;
  }
  .today-q .tq-actions{ display:flex; justify-content:flex-end; margin-top:8px; }
  .today-q .tq-actions button{
    border:none; background: rgba(255,255,255,.9); color: var(--accent); font-weight:700;
    padding: 7px 16px; border-radius: var(--radius-sm); font-size:.82rem; cursor:pointer;
  }

  .qa-item{ background: var(--bg-elevated); border:1px solid var(--border); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .qa-item .qa-cat{ font-size:.68rem; color: var(--accent); font-weight:700; }
  .qa-item .qa-text{ font-size:.9rem; font-weight:700; margin: 4px 0 8px; }
  .qa-item textarea{ width:100%; border-radius: var(--radius-md); border:1px solid var(--border); background: var(--bg); color: var(--text); padding:9px 11px; font-size:.85rem; min-height:52px; }
  .qa-item .qa-save{ border:none; background: var(--accent); color: var(--accent-text); padding:7px 14px; border-radius: var(--radius-sm); font-size:.78rem; font-weight:700; cursor:pointer; margin-top:6px; }
  .qa-answer{ background: var(--chip-bg); border-radius: var(--radius-md); padding: 10px 12px; font-size:.86rem; }
  .qa-answer .qa-date{ font-size:.68rem; color: var(--text-muted); margin-top:4px; }
  .qa-item-actions{ display:flex; gap:8px; margin-top:8px; }
  .qa-item-actions button{ border:none; background:transparent; color: var(--accent); font-size:.76rem; font-weight:700; cursor:pointer; padding:4px 0; }
  .qa-history{ margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .qa-history .hist-entry{ font-size:.78rem; color: var(--text-muted); margin-bottom:6px; }
  .qa-history .hist-entry .hd{ font-size:.68rem; }

  /* ---------- personality quiz ---------- */
  .convergence-badge{ display:inline-block; font-size:.72rem; font-weight:700; padding:5px 12px; border-radius: var(--radius-sm); background: var(--chip-bg); color: var(--accent); margin-bottom:12px; }
  .trait-bar-row{ margin-bottom:12px; }
  .trait-bar-row:last-child{ margin-bottom:0; }
  .trait-bar-row .tb-head{ display:flex; justify-content:space-between; font-size:.82rem; font-weight:700; margin-bottom:5px; gap:8px; }
  .trait-bar-row .tb-head .tb-count{ font-weight:500; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .trait-bar-row .tb-track{ height:10px; border-radius:999px; background: var(--chip-bg); overflow:hidden; }
  .trait-bar-row .tb-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg,var(--accent),var(--accent-2)); transition: width .4s ease; }
  .trait-bar-row .tb-desc{ font-size:.76rem; color: var(--text-muted); margin-top:5px; }
  .quiz-likert{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .quiz-likert button{
    flex:1; min-width:58px; border:1px solid var(--border); background: var(--bg); color: var(--text);
    padding: 11px 4px; border-radius: var(--radius-md); font-size:.74rem; cursor:pointer; font-weight:600;
  }
  .quiz-likert button:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- intro text / card ---------- */
  .gen-btn{ width:100%; border:none; background: var(--accent); color: var(--accent-text); padding: 12px; border-radius: var(--radius-md); font-size:.92rem; font-weight:800; cursor:pointer; }
  .gen-output{
    margin-top: 12px; background: var(--chip-bg); border-radius: var(--radius-md); padding: 14px; font-size:.92rem;
    white-space: pre-wrap; min-height: 60px;
  }
  .gen-output.empty{ color: var(--text-muted); font-size:.85rem; }
  .gen-actions{ display:flex; gap:8px; margin-top:10px; }
  .gen-actions button{
    flex:1; border:1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    padding: 9px; border-radius: var(--radius-sm); font-size:.82rem; font-weight:700; cursor:pointer;
  }

  .card-color-row{ display:flex; gap:8px; margin: 4px 0 14px; }
  .card-color-swatch{ width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .card-color-swatch.active{ border-color: var(--text); }

  .intro-card-preview{
    border-radius:24px; padding:26px 24px; color:#fff; box-shadow: var(--shadow); position:relative; overflow:hidden;
  }
  .intro-card-preview .ic-name{ font-size:1.5rem; font-weight:800; }
  .intro-card-preview .ic-sub{ font-size:.8rem; opacity:.85; margin-top:2px; }
  .intro-card-preview .ic-motto{ margin:14px 0 0; font-size:.95rem; font-style:italic; opacity:.95; }
  .intro-card-preview .ic-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .intro-card-preview .ic-chip{ background: rgba(255,255,255,.22); padding:4px 11px; border-radius:999px; font-size:.72rem; font-weight:600; }
  .intro-card-preview .ic-footer{ margin-top:18px; font-size:.66rem; opacity:.7; text-align:right; }
  .intro-card-preview .ic-empty{ font-size:.85rem; opacity:.85; }

  /* ---------- settings ---------- */
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom: 4px; }
  .stat-box{ background: var(--chip-bg); border-radius: var(--radius-md); padding: 12px 8px; text-align:center; }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return deepClone(DEFAULT_DATA);
      var parsed = JSON.parse(raw);
      return Object.assign(deepClone(DEFAULT_DATA), parsed, {
        basic: Object.assign({}, DEFAULT_DATA.basic, parsed.basic),
        lists: Object.assign({}, DEFAULT_DATA.lists, parsed.lists),
        personality: Object.assign({ responses:{} }, parsed.personality),

  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

  function pickTodayQuestionId(){

    var seed = Number(d.getFullYear()+""+(d.getMonth()+1)+""+d.getDate());

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
  }

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  function effectiveIsDark(){
    var attr = document.documentElement.getAttribute("data-theme");
    if(attr === "dark") return true;
    if(attr === "light") return false;
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function initTheme(){

  // 画面内モーダル（確認・通知）。Claude Artifactのサンドボックス内ではブラウザ標準の
  // confirm()/alert() がブロックされ何も起きないことがあるため、自前で実装している。
  function closeModal(overlay){ if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  function showConfirm(message, onConfirm, opts){
    opts = opts || {};
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var confirmClass = "btn-confirm" + (opts.danger ? " danger" : "");
    overlay.innerHTML =
      '<div class="modal-box"><p>' + escapeHtml(message) + '</p><div class="modal-actions">' +
      '<button class="btn-cancel" id="modalCancelBtn">' + escapeHtml(opts.cancelLabel || "キャンセル") + '</button>' +
      '<button class="' + confirmClass + '" id="modalConfirmBtn">' + escapeHtml(opts.confirmLabel || "OK") + '</button>' +
      '</div></div>';
    document.querySelector(".phone-screen").appendChild(overlay);
    overlay.querySelector("#modalCancelBtn").addEventListener("click", function(){ closeModal(overlay); });
    overlay.querySelector("#modalConfirmBtn").addEventListener("click", function(){ closeModal(overlay); onConfirm(); });
  }
  function showAlert(message){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-box"><p>' + escapeHtml(message) + '</p><div class="modal-actions">' +
      '<button class="btn-confirm" id="modalOkBtn">OK</button></div></div>';
    document.querySelector(".phone-screen").appendChild(overlay);
    overlay.querySelector("#modalOkBtn").addEventListener("click", function(){ closeModal(overlay); });
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("コピーしました"); }, function(){ fallbackCopy(text); });
    }else{ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("コピーしました"); }catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }

  // Claude Artifact上ではサンドボックスの制約で通常のダウンロードリンクが動作しないため、
  // downloads機能が使えればそちらを使い、なければブラウザの通常ダウンロードにフォールバックする。
  function offerFileDownload(filename, dataVal, mime){
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(downloads){
        if(!downloads){ fallbackDownload(filename, dataVal, mime); return; }
        downloads.save({ filename: filename, data: dataVal }).then(function(){
          toast("保存しました");
        }, function(err){
          if(err && err.code === "declined") return;
          fallbackDownload(filename, dataVal, mime);
        });
      }, function(){ fallbackDownload(filename, dataVal, mime); });
      return;
    }
    fallbackDownload(filename, dataVal, mime);
  }
  function fallbackDownload(filename, dataVal, mime){
    var blob = (dataVal instanceof Blob) ? dataVal : new Blob([dataVal], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("保存しました");
  }

  function computeCompleteness(){
    var total = 0, filled = 0;
    var basicFields = ["name","nickname","birthday","bloodType","hometown","occupation","motto"];
    basicFields.forEach(function(k){ total++; if(data.basic[k]) filled++; });
    Object.keys(data.lists).forEach(function(k){ total++; if(data.lists[k].length) filled++; });
    total++; if(data.favorites.length) filled++;
    total++; if(data.goals) filled++;
    total++; if(Object.keys(data.qa).length) filled++;
    total++; if(Object.keys(data.personality.responses).length) filled++;
    return Math.round((filled/total)*100);
  }

  function renderProgress(){
    var pct = computeCompleteness();
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function onboardingTotal(){ return ONBOARDING_SLIDES.length + BASIC_STEPS.length; }

  function renderOnboarding(){
    var total = onboardingTotal();
    var idx = Math.max(0, Math.min(onboardingState.index, total-1));
    onboardingState.index = idx;

    // 基本情報の途中で「スワイプして探す」を開いた場合は、チュートリアルの
    // 流れを離脱させず、同じ画面の中にスワイプ発見を埋め込んで表示する

      return '<div class="onboarding-wrap"><button class="wz-home-btn" id="obSwipeBack">← もどる</button>' + renderSwipeView() + '</div>';
    }

    var isIntro = idx < ONBOARDING_SLIDES.length;
    var html = '<div class="onboarding-wrap">';

    if(isIntro){
      html += '<button class="onboarding-skip" id="obSkip">スキップ</button>';
      var slide = ONBOARDING_SLIDES[idx];
      html += '<div class="onboarding-body"><div class="onboarding-icon">'+slide.icon+'</div>';

      html += '<div class="onboarding-body"><div class="onboarding-icon">'+step.icon+'</div>';
      html += '<div class="onboarding-title">'+escapeHtml(step.label)+'</div>';

    }

    html += '<div class="onboarding-nav">';
    if(idx > 0) html += '<button class="wz-btn ghost" id="obBack">戻る</button>';

  function bindOnboardingEvents(){
    if(onboardingState.mode === "swipe"){
      var swipeBack = document.getElementById("obSwipeBack");
      if(swipeBack) swipeBack.addEventListener("click", function(){ onboardingState.mode = "field"; render(); });
      bindSwipeEvents();
      return;
    }

    var idx = onboardingState.index;
    var isIntro = idx < ONBOARDING_SLIDES.length;

    var skip = document.getElementById("obSkip");
    if(skip) skip.addEventListener("click", function(){ onboardingState.index = ONBOARDING_SLIDES.length; render(); });
    var back = document.getElementById("obBack");

  function stepPreview(step){
    if(step.type === "text" || step.type === "date"){
      var v = data.basic[step.basicKey];

      return step.type === "date" ? fmtDate(v) : v;

    if(step.type === "taglist"){
      var items = data.lists[step.listKey];
      if(!items.length) return "";
      return items.slice(0,3).join("、") + (items.length > 3 ? " 他" : "");
    }
    if(step.type === "favorites") return data.favorites.length ? data.favorites.length + "件登録済み" : "";
    if(step.type === "textarea") return data[step.key] ? (data[step.key].slice(0,20) + (data[step.key].length > 20 ? "…" : "")) : "";
    if(step.type === "custom") return data.customSections.length ? data.customSections.length + "個の項目" : "";
    return "";
  }

  // 基本情報（text / date / blood）の入力欄を、通常のウィザードとオンボーディングの
  // どちらからでも共通で扱うためのバインド処理。advanceFn には「次へ進む」処理を渡す。
  function bindBasicFieldInputs(step, advanceFn){
    // テキスト系の項目は自動でフォーカスし、Enterキーでも次へ進めるようにする（より直感的な入力のため）
    var wzInput = document.getElementById("wzInput");
    if(wzInput){
      wzInput.addEventListener("change", function(){
        if(step.basicKey) data.basic[step.basicKey] = wzInput.value;
        else if(step.key) data[step.key] = wzInput.value;
        saveData(); renderProgress();
      });
      if(step.type === "text" || step.type === "textarea"){
        setTimeout(function(){ wzInput.focus(); }, 30);
      }
      if(step.type === "text"){
        wzInput.addEventListener("keydown", function(e){
          if(e.key === "Enter"){ e.preventDefault(); wzInput.dispatchEvent(new Event("change")); advanceFn(); }
        });
      }
    }

    // 血液型：選んだらすぐ次へ進む
    document.querySelectorAll("[data-blood]").forEach(function(btn){
      btn.addEventListener("click", function(){
        data.basic.bloodType = btn.dataset.blood;
        saveData(); render();
        setTimeout(advanceFn, 220);
      });
    });

    // 誕生日：年・月・日をそれぞれ選ぶドラム式ピッカー
    var yearSel = document.getElementById("wzYear"), monthSel = document.getElementById("wzMonth"), daySel = document.getElementById("wzDay");
    if(yearSel && monthSel && daySel){
      var updateBirthday = function(){
        if(yearSel.value && monthSel.value && daySel.value) data.basic.birthday = yearSel.value + "-" + monthSel.value + "-" + daySel.value;
        else data.basic.birthday = "";
        saveData(); renderProgress();
      };
      [yearSel, monthSel, daySel].forEach(function(sel){ sel.addEventListener("change", updateBirthday); });
    }

    // 座右の銘など、自分では思い浮かびにくい項目：数秒操作がなければ
    // アイリスアウト風に画面を絞り込んでスワイプ発見ボタンへ視線を誘導する
    if(step.swipeCat && step.type === "text" && wzInput){
      var hintMsg = document.getElementById("swipeHintMsg");
      var hintBtn = document.getElementById("swipeHintBtn");
      var hintTimer = null;
      var scheduleHint = function(){
        clearTimeout(hintTimer);
        if(hintMsg) hintMsg.classList.add("hidden");
        if(hintBtn) hintBtn.classList.remove("pulse");
        removeIrisOverlay();
        hintTimer = setTimeout(function(){
          if(wzInput.value.trim()) return; // すでに入力済みなら出さない
          if(hintMsg) hintMsg.classList.remove("hidden");
          if(hintBtn) hintBtn.classList.add("pulse");
          triggerIrisHint(hintBtn);
        }, 4000);
      };
      wzInput.addEventListener("input", scheduleHint);
      scheduleHint();
    }
  }

  // 画面全体を暗くしながら、対象ボタンだけを丸く残して絞り込んでいく
  // 「アイリスアウト」風の演出。影の部分にチュートリアル文を表示し、
  // 画面をタップすると1回で消える。
  function removeIrisOverlay(){
    var existing = document.querySelector(".iris-overlay");
    if(existing && existing.parentNode) existing.parentNode.removeChild(existing);
  }
  function dismissIrisOverlay(overlay){
    overlay.style.transition = "opacity .3s ease";
    overlay.style.opacity = "0";
    overlay.style.pointerEvents = "none";
    setTimeout(removeIrisOverlay, 320);
  }
  function triggerIrisHint(targetEl){
    removeIrisOverlay();
    if(!targetEl) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var screenEl = document.querySelector(".phone-screen");
    if(!screenEl) return;

    var screenRect = screenEl.getBoundingClientRect();
    var btnRect = targetEl.getBoundingClientRect();
    var cx = btnRect.left - screenRect.left + btnRect.width / 2;
    var cy = btnRect.top - screenRect.top + btnRect.height / 2;
    var smallR = Math.max(btnRect.width, btnRect.height) / 2 + 16;
    var largeR = Math.hypot(Math.max(cx, screenRect.width - cx), Math.max(cy, screenRect.height - cy)) + 40;

    // チュートリアル文は、円の外側に残る暗い余白のちょうど真ん中に来るよう動的に位置を決める
    var circleTop = cy - smallR, circleBottom = cy + smallR;
    var textY;
    if(circleTop > 90) textY = circleTop / 2;
    else if(screenRect.height - circleBottom > 90) textY = circleBottom + (screenRect.height - circleBottom) / 2;
    else textY = Math.max(70, circleTop / 2);

    var overlay = document.createElement("div");
    overlay.className = "iris-overlay";
    var ring = document.createElement("div");
    ring.className = "iris-ring";
    var tutorialText = document.createElement("div");
    tutorialText.className = "iris-tutorial-text";
    tutorialText.style.top = textY + "px";
    tutorialText.innerHTML = "💡 わからない時は、下のボタンでスワイプして探すのがおすすめです<span class=\"its-sub\">画面をタップすると閉じます</span>";
    overlay.appendChild(ring);
    overlay.appendChild(tutorialText);
    overlay.addEventListener("click", function(){ dismissIrisOverlay(overlay); });
    screenEl.appendChild(overlay);

    function setRing(r){
      ring.style.width = (r * 2) + "px";
      ring.style.height = (r * 2) + "px";
      ring.style.left = (cx - r) + "px";
      ring.style.top = (cy - r) + "px";
    }
    setRing(largeR);
    ring.getBoundingClientRect(); // 強制リフローで開始状態を確定させる
    ring.style.transition = "width .7s cubic-bezier(.3,.9,.4,1), height .7s cubic-bezier(.3,.9,.4,1), left .7s cubic-bezier(.3,.9,.4,1), top .7s cubic-bezier(.3,.9,.4,1)";
    requestAnimationFrame(function(){
      setRing(smallR);
      tutorialText.classList.add("show");
    });
  }

  /* =========================================================
     9. スワイプ発見
  ========================================================= */

  function swipeBank(cat){
    if(cat === "motto") return MOTTO_BANK;
    if(cat === "strength") return STRENGTH_BANK;
    if(cat === "weakness") return WEAKNESS_BANK;
    return FAVORITE_BANK.map(function(f){ return { category:f.c, value:f.v }; });
  }
  function swipeAlreadyHas(cat, item){
    if(cat === "motto") return data.basic.motto === item;
    if(cat === "strength") return data.lists.strengths.indexOf(item) !== -1;
    if(cat === "weakness") return data.lists.weaknesses.indexOf(item) !== -1;
    if(cat === "favorite") return data.favorites.some(function(f){ return f.category===item.category && f.value===item.value; });
    return false;
  }
  function buildSwipeQueue(cat){
    var bank = swipeBank(cat);
    var avail = bank.filter(function(item){ return !swipeAlreadyHas(cat,item); });
    if(!avail.length) avail = bank.slice();
    state.swipeCat = cat;
    state.swipeQueue = shuffle(avail.slice());
  }
  function countAdded(cat){
    if(cat === "motto") return data.basic.motto ? 1 : 0;
    if(cat === "strength") return data.lists.strengths.length;
    if(cat === "weakness") return data.lists.weaknesses.length;
    return data.favorites.length;
  }
  function applySwipeAccept(cat, item){
    if(cat === "motto"){ data.basic.motto = item; toast("座右の銘に設定しました"); }
    else if(cat === "strength"){ if(data.lists.strengths.indexOf(item)===-1){ data.lists.strengths.push(item); } toast("長所に追加しました"); }
    else if(cat === "weakness"){ if(data.lists.weaknesses.indexOf(item)===-1){ data.lists.weaknesses.push(item); } toast("短所に追加しました"); }
    else if(cat === "favorite"){ if(!data.favorites.some(function(f){return f.category===item.category&&f.value===item.value;})){ data.favorites.push({category:item.category, value:item.value}); } toast("好きなものに追加しました"); }
  }

  function renderSwipeView(){
    if(!state.swipeQueue || !state.swipeQueue.length) buildSwipeQueue(state.swipeCat);
    var meta = SWIPE_CAT_META[state.swipeCat];
    var html = '<div class="cat-chips">';
    Object.keys(SWIPE_CAT_META).forEach(function(k){
      html += '<button class="cat-chip'+(state.swipeCat===k?" active":"")+'" data-swipecat="'+k+'">'+SWIPE_CAT_META[k].icon+' '+SWIPE_CAT_META[k].label+'</button>';
    });
    html += '</div>';
    html += '<div class="swipe-wrap"><div class="swipe-stage" id="swipeStage">';
    var queue = state.swipeQueue;
    if(!queue.length){
      html += '<div class="swipe-empty">候補がありません</div>';
    }else{
      var count = Math.min(3, queue.length);
      for(var i=count-1;i>=0;i--){
        var item = queue[i];
        var text = state.swipeCat === "favorite" ? item.value : item;
        var cls = "swipe-card" + (i===0 ? " top" : " behind-"+i);
        html += '<div class="'+cls+'"'+(i===0?' id="swipeTopCard"':'')+' style="background:linear-gradient(135deg,'+meta.grad[0]+','+meta.grad[1]+')">';
        if(state.swipeCat === "favorite") html += '<div class="sc-cat">'+escapeHtml(item.category)+'</div>';
        html += '<div class="sc-text">'+escapeHtml(text)+'</div></div>';
      }
    }
    html += '</div>';
    html += '<div class="swipe-actions"><button class="swipe-btn reject" id="swipeRejectBtn" title="スキップ">✕</button><button class="swipe-btn accept" id="swipeAcceptBtn" title="追加する">♥</button></div>';
    html += '<div class="swipe-count">これまでに ' + countAdded(state.swipeCat) + ' 個 追加済み</div>';
    html += '</div>';
    return html;
  }

  function bindSwipeEvents(){
    var app = document.getElementById("app");
    app.querySelectorAll("[data-swipecat]").forEach(function(btn){
      btn.addEventListener("click", function(){ buildSwipeQueue(btn.dataset.swipecat); render(); });
    });
    var acceptBtn = document.getElementById("swipeAcceptBtn");
    if(acceptBtn) acceptBtn.addEventListener("click", function(){ commitSwipe(true); });
    var rejectBtn = document.getElementById("swipeRejectBtn");
    if(rejectBtn) rejectBtn.addEventListener("click", function(){ commitSwipe(false); });
    var topCard = document.getElementById("swipeTopCard");
    if(topCard) bindDrag(topCard);
  }

  function commitSwipe(accepted){
    var queue = state.swipeQueue;
    if(!queue || !queue.length) return;
    var item = queue[0];
    if(accepted) applySwipeAccept(state.swipeCat, item);
    queue.shift();
    if(!queue.length) buildSwipeQueue(state.swipeCat);
    saveData(); render();
  }

  function bindDrag(el){
    var startX=0, startY=0, dx=0, dragging=false;
    el.addEventListener("pointerdown", function(e){
      dragging = true; startX = e.clientX; startY = e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx = e.clientX - startX;
      var dy = e.clientY - startY;
      el.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+(dx/18)+"deg)";
    });
    function release(){
      if(!dragging) return;
      dragging = false;
      if(Math.abs(dx) > 90){ commitSwipe(dx > 0); }
      else{ el.style.transition = "transform .25s ease"; el.style.transform = ""; }
      dx = 0;
    }
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
  }

  // ---- 性格診断 ----
  function computeTraitStats(){
    var sums = {}; Object.keys(PERSONALITY_TRAITS).forEach(function(k){ sums[k] = { sum:0, count:0 }; });
    PERSONALITY_STATEMENTS.forEach(function(s){
      var r = data.personality.responses[s.id];
      if(!r) return;
      var val = s.reverse ? (6 - r.value) : r.value;
      sums[s.trait].sum += val; sums[s.trait].count++;
    });
    var out = {};
    Object.keys(sums).forEach(function(k){
      var st = sums[k];
      var avg = st.count ? st.sum/st.count : 3;
      var pct = Math.round(((avg-1)/4)*100);
      out[k] = { pct: pct, count: st.count, level: pct<40?"low":(pct<65?"mid":"high") };
    });
    return out;
  }
  function getTopPersonalityTrait(){
    var totalAnswered = Object.keys(data.personality.responses).length;
    if(totalAnswered < 5) return null;
    var stats = computeTraitStats();
    var topKey = null;
    Object.keys(stats).forEach(function(k){ if(!topKey || stats[k].pct > stats[topKey].pct) topKey = k; });
    return topKey ? (PERSONALITY_TRAITS[topKey].label + "高め") : null;
  }
  function pickNextStatement(){
    var unanswered = PERSONALITY_STATEMENTS.filter(function(s){ return !data.personality.responses[s.id]; });
    return unanswered.length ? pick(unanswered) : pick(PERSONALITY_STATEMENTS);
  }

  function renderPersonalityQuiz(){
    var stats = computeTraitStats();
    var confSum = 0;
    Object.keys(stats).forEach(function(k){ confSum += Math.min(1, stats[k].count / CONVERGE_TARGET); });
    var confPct = Math.round(confSum/5*100);

    var html = '<div class="card"><h2>🧠 性格診断</h2><p class="card-desc">直感で答えてください。何度でも答えられ、答えるほど結果がはっきり収束していきます。</p>';
    html += '<div class="convergence-badge">診断の安定度：' + confPct + '%</div>';
    Object.keys(PERSONALITY_TRAITS).forEach(function(k){
      var t = PERSONALITY_TRAITS[k], st = stats[k];
      html += '<div class="trait-bar-row"><div class="tb-head"><span>'+t.label+'</span><span class="tb-count">'+st.pct+'%・'+st.count+'回回答</span></div>';
      html += '<div class="tb-track"><div class="tb-fill" style="width:'+st.pct+'%"></div></div>';
      html += '<div class="tb-desc">'+escapeHtml(LEVEL_DESC[k][st.level])+'</div></div>';
    });
    html += '</div>';

    var stmt = pickNextStatement();
    var reinforcement = !!data.personality.responses[stmt.id];
    html += '<div class="card">';
    html += '<h2>'+(reinforcement ? "🔁 もう一度答えてみましょう" : "❓ 質問")+'</h2>';
    if(reinforcement) html += '<p class="card-desc">回答済みの質問です。同じでも違ってもOK、答えるたびに精度が上がります。</p>';
    html += '<p style="font-size:1rem;font-weight:700;margin:6px 0 0;">'+escapeHtml(stmt.text)+'</p>';
    html += '<div class="quiz-likert">';
    [[1,"全く違う"],[2,"やや違う"],[3,"どちらとも"],[4,"ややそう"],[5,"まさにそう"]].forEach(function(o){
      html += '<button data-likert="'+o[0]+'" data-stid="'+stmt.id+'">'+o[1]+'</button>';

      parts.push("最近は" + fav.value + "（" + fav.category + "）にはまっています。");

  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function truncateToWidth(ctx,text,maxW){
    if(ctx.measureText(text).width <= maxW) return text;
    var t = text;
    while(t.length > 1 && ctx.measureText(t+"…").width > maxW){ t = t.slice(0,-1); }
    return t + "…";
  }
  function drawChipsWrap(ctx, chips, startX, startY, maxWidth, fontSize){
    ctx.font = fontSize + 'px "Hiragino Sans","Yu Gothic",sans-serif';
    var x = startX, y = startY, lineH = fontSize + 24;
    chips.forEach(function(label){
      var textW = ctx.measureText(label).width;
      var chipW = textW + 30, chipH = fontSize + 18;
      if(x + chipW > startX + maxWidth){ x = startX; y += lineH; }
      ctx.globalAlpha = 0.24; ctx.fillStyle = "#ffffff";
      roundRectPath(ctx,x,y,chipW,chipH,chipH/2); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = "#ffffff";
      ctx.fillText(label, x+15, y+chipH-11);
      x += chipW + 10;
    });
    return y + lineH;
  }

  function drawIntroCard(){
    var theme = cardTheme();
    var W = 900, H = 560, pad = 40, radius = 36;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#f3f2f8";
    ctx.fillRect(0,0,W,H);

    var cx = pad, cy = pad, cw = W - pad*2, ch = H - pad*2;
    var grad = ctx.createLinearGradient(cx,cy,cx+cw,cy+ch);
    grad.addColorStop(0, theme.grad[0]); grad.addColorStop(1, theme.grad[1]);
    ctx.fillStyle = grad;
    roundRectPath(ctx,cx,cy,cw,ch,radius); ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "alphabetic";
    var name = data.basic.nickname || data.basic.name || "じぶん手帳ユーザー";
    ctx.font = 'bold 46px "Hiragino Sans","Yu Gothic",sans-serif';
    var curY = cy + 80;
    ctx.fillText(truncateToWidth(ctx,name,cw-80), cx+40, curY);

    var sub = [data.basic.occupation, data.basic.hometown].filter(Boolean).join("　・　");
    if(sub){
      ctx.font = '20px "Hiragino Sans","Yu Gothic",sans-serif';
      ctx.globalAlpha = 0.88; curY += 34;
      ctx.fillText(truncateToWidth(ctx,sub,cw-80), cx+40, curY);
      ctx.globalAlpha = 1;
    }
    if(data.basic.motto){
      ctx.font = 'italic 26px "Hiragino Sans","Yu Gothic",sans-serif';
      curY += 56;
      ctx.fillText(truncateToWidth(ctx,'"'+data.basic.motto+'"', cw-80), cx+40, curY);
    }
    var chips = cardChipList();
    if(chips.length){
      curY += 50;
      drawChipsWrap(ctx, chips, cx+40, curY, cw-80, 17);
    }

    ctx.font = '16px "Hiragino Sans","Yu Gothic",sans-serif';
    ctx.globalAlpha = 0.75; ctx.textAlign = "right";
    ctx.fillText("📔 じぶん手帳", cx+cw-30, cy+ch-26);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;

    return canvas;
  }

    var personalityCount = Object.keys(data.personality.responses).length;

    var html = '<div class="card"><h2>📊 記録の状況</h2><div class="stat-grid">';
    html += '<div class="stat-box"><div class="num">'+tagCount+'</div><div class="lbl">登録タグ数</div></div>';
    html += '<div class="stat-box"><div class="num">'+favCount+'</div><div class="lbl">好きなもの</div></div>';
    html += '<div class="stat-box"><div class="num">'+qaCount+'</div><div class="lbl">回答した質問</div></div>';
    html += '</div>';
    html += '<p class="card-desc" style="margin-top:10px;">性格診断への回答：'+personalityCount+'回';
    if(data.meta.updatedAt) html += '　／　最終更新：'+fmtDate(data.meta.updatedAt);
    html += '</p></div>';

    html += '<div class="card"><h2>💾 データの管理</h2><p class="card-desc">この端末のブラウザだけに保存されています。機種変更やブラウザの変更前にバックアップしましょう。</p>';
    html += '<button class="settings-btn" id="exportBtn">⬇️ エクスポート（JSONで保存）</button>';
    html += '<button class="settings-btn" id="importBtn">⬆️ インポート（JSONを読み込む）</button>';
    html += '<input type="file" id="importFile" accept="application/json">';
    html += '<button class="settings-btn danger" id="resetBtn">🗑️ すべてのデータを削除</button>';
    html += '<p class="settings-footnote">データはこの端末のブラウザ内（localStorage）だけに保存されます。サーバーには送信されません。</p>';
    html += '</div>';
    return html;
  }

  function bindSettingsEvents(){
    var app = document.getElementById("app");
    var exportBtn = document.getElementById("exportBtn");
    if(exportBtn) exportBtn.addEventListener("click", exportData);
    var importBtn = document.getElementById("importBtn");
    var importFile = document.getElementById("importFile");
    if(importBtn && importFile){
      importBtn.addEventListener("click", function(){ importFile.click(); });
      importFile.addEventListener("change", function(){ if(importFile.files[0]) importData(importFile.files[0]); });
    }
    var resetBtn = document.getElementById("resetBtn");
    if(resetBtn) resetBtn.addEventListener("click", resetData);
  }

  function exportFilename(){
    var d = new Date();
    return "jibun-techo-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + ".json";
  }
  function exportData(){
    offerFileDownload(exportFilename(), JSON.stringify(data,null,2), "application/json");
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        showAlert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
        return;
      }
      showConfirm("現在のデータを上書きしてインポートしますか？", function(){
        data = Object.assign(deepClone(DEFAULT_DATA), parsed, {
          basic: Object.assign({}, DEFAULT_DATA.basic, parsed.basic),
          lists: Object.assign({}, DEFAULT_DATA.lists, parsed.lists),
          personality: Object.assign({ responses:{} }, parsed.personality),
          meta: Object.assign({}, DEFAULT_DATA.meta, parsed.meta)
        });
        saveData();
        switchView("home");
        toast("インポートしました");
      });
    };
    reader.readAsText(file);
  }

  function resetData(){
    showConfirm("すべてのプロフィールデータを削除します。この操作は取り消せません。よろしいですか？", function(){
      showConfirm("本当に削除してよろしいですか？", function(){
        data = deepClone(DEFAULT_DATA);
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        saveData();
        wizardState.stepIndex = 0;
        onboardingState.index = 0;
        state.wizardReturnView = "home";
        switchView("onboarding");
        toast("データを削除しました");
      }, { danger:true, confirmLabel:"完全に削除する" });
    }, { danger:true, confirmLabel:"削除する" });
  }

  /* =========================================================
     13. 初期化
  ========================================================= */

  initTheme();

  if(!data.meta.onboardingSeen){
    onboardingState.index = 0;
    state.view = "onboarding";
  }else if(!data.meta.wizardStarted){
    data.meta.wizardStarted = true;
    data.meta.wizardStep = 0;
    saveData();
    wizardState.stepIndex = 0;
    state.wizardReturnView = "home";
    state.view = "wizard";
  }else{
    state.view = "home";
  }
  document.querySelectorAll(".bn-buttons button").forEach(function(b){ b.classList.toggle("active", b.dataset.view === state.view); });
  render();

  // 起動画面（スプラッシュ）を少し見せてからアプリ本体を表示する
  var splashEl = document.getElementById("splash");
  if(splashEl){
    setTimeout(function(){
      splashEl.classList.add("hide");
      setTimeout(function(){ if(splashEl.parentNode) splashEl.parentNode.removeChild(splashEl); }, 450);
    }, 1000);
  }

})();
</script>
</body>
</html>
